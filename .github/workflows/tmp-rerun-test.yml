name: TMP rerun label test
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [tmp-rerun-base]
permissions: {}
jobs:
  changelog:
    permissions:
      contents: read
      pull-requests: read
    uses: open-telemetry/shared-workflows/.github/workflows/chloggen.yml@f09a36e1fa2576787fe05cbc1313ef6066918c78  # v0.23.0
    with:
      go-version: '1.27.1'
      skip-title-marker: ''
